<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#08080c"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <g font-family="'DM Mono','JetBrains Mono','IBM Plex Mono','Consolas',monospace" font-weight="500" letter-spacing="-0.015em">
    <text x="290" y="220" font-size="48" fill="rgba(255,255,255,0.45)">$</text>
    <text x="345" y="220" font-size="48" fill="#ffffff">act run </text>
    <text x="555" y="220" font-size="48" fill="#f59e0b">ghcr.io/actpkg/sqlite</text>
    <text x="1163" y="220" font-size="48" fill="rgba(255,255,255,0.45)">--mcp</text>
  </g>

  <text x="290" y="295" font-family="'Instrument Sans','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="26" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="-0.005em">wasm sandbox · declared capability ceiling · signed OCI artifact</text>

  <text x="290" y="395" font-family="'Syne','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-0.03em">Hardened AI <tspan fill="#f59e0b">toolchain.</tspan></text>

  <text x="1430" y="450" text-anchor="end"
        font-family="'DM Mono','JetBrains Mono','IBM Plex Mono','Consolas',monospace"
        font-size="38" font-weight="500" fill="#f59e0b" letter-spacing="-0.02em">act()</text>
</svg>
